<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Internal Tools{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script>
    // Swap 4xx responses (readable error fragments retargeted to #messages) instead of
    // dropping them, and clear old messages when a new request starts.
    document.addEventListener("htmx:beforeSwap", (e) => {
      const status = e.detail.xhr.status;
      if (status >= 400 && status < 500) { e.detail.shouldSwap = true; e.detail.isError = false; }
    });
    document.addEventListener("htmx:beforeRequest", () => {
      const box = document.getElementById("messages");
      if (box) box.innerHTML = "";
    });
  </script>
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <strong>Internal Tools</strong>
      {% if can(user, "refunds.view") %}<a href="/refunds">Refunds</a>{% endif %}
      {% if can(user, "audit.view") %}<a href="/audit">Audit log</a>{% endif %}
    </nav>
    <form class="user-switcher" method="post" action="/switch-user">
      <label for="user-switcher">Acting as</label>
      <select id="user-switcher" name="user_id" onchange="this.form.submit()">
        <option value="" disabled {% if not user %}selected{% endif %}>choose a user</option>
        {% for u in switcher_users %}
        <option value="{{ u.id }}" {% if user and user.id == u.id %}selected{% endif %}>{{ u.name }} ({{ u.role }})</option>
        {% endfor %}
      </select>
      <noscript><button type="submit">Switch</button></noscript>
    </form>
  </header>
  <main>
    <div id="messages" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
