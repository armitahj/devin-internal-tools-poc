services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: refunds
      POSTGRES_DB: refunds
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunds"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
