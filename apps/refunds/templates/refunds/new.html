{% extends "base.html" %}
{% block title %}New refund{% endblock %}
{% block content %}
<p><a href="/refunds">&larr; All refunds</a></p>
<h1>New refund</h1>
<form class="stacked card" method="post" action="/refunds" hx-post="/refunds" hx-disabled-elt="find button">
  <label for="transaction_id">Transaction</label>
  <select id="transaction_id" name="transaction_id" required>
    {% for t in transactions %}
    <option value="{{ t.tx.id }}" {% if t.remaining <= 0 %}disabled{% endif %}>#{{ t.tx.id }} {{ t.tx.customer_name }}: {{ t.tx.amount_cents | cents }}, {{ t.remaining | cents }} still refundable</option>
    {% endfor %}
  </select>
  <label for="amount">Amount (USD)</label>
  <input id="amount" name="amount" inputmode="decimal" placeholder="120.00" required>
  <label for="reason">Reason</label>
  <textarea id="reason" name="reason" rows="3" required></textarea>
  <p class="hint">Refunds over $500 need an admin to approve. You cannot approve your own request.</p>
  <button class="btn primary" type="submit">Submit refund</button>
</form>
{% endblock %}
